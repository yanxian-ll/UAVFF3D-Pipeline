[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uavff3d-pipeline"
version = "0.1.0"
description = "Data processing utilities for the UAVFF3D benchmark."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "UAVFF3D Authors"}
]
keywords = ["UAV", "3D reconstruction", "dataset", "photogrammetry", "WAI"]
dynamic = ["dependencies"]

[tool.setuptools]
py-modules = ["covisibility", "generate_scene_meta", "split_scene"]

[tool.setuptools.packages.find]
include = ["dataset*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".git", "outputs", "data", "metadata"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
